services:
  threadlearn_web_be:
    build:
      context: .
      dockerfile: Dockerfile
    image: threadlearn_web_be:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MOCK_MODE=false
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - uploads:/app/public/uploads
      - logs:/app/logs

  redis:
    container_name: threadlearn_redis
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  uploads:
  logs: